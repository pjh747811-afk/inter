<!doctype html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d55d8"><title>리서치랩 · 고객검증 워크스페이스</title>
<style>
:root{--bg:#f7f7fb;--surface:#fff;--ink:#25233a;--muted:#77778d;--line:#e9e8f1;--purple:#6d55d8;--pale:#f0edff;--green:#1d9670;--orange:#e28b46;--blue:#5488d9;--shadow:0 8px 30px #30245b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Pretendard','Noto Sans KR',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:flex}.sidebar{width:248px;position:fixed;inset:0 auto 0 0;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;z-index:3}.brand{display:flex;gap:12px;align-items:center;padding:4px 10px 30px}.brandicon{background:var(--purple);color:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:20px}.brand strong{display:block}.brand small{color:var(--muted)}.navtitle{font-size:11px;color:#aaa6bb;font-weight:700;letter-spacing:.1em;padding:0 12px 10px}.nav button{border:0;background:none;width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:#77748b;text-align:left;margin-bottom:4px}.nav button.active{background:var(--pale);color:var(--purple);font-weight:700}.guide{margin-top:auto;background:#f7f4ff;border:1px solid #e9e1ff;border-radius:14px;padding:14px;text-align:left;color:var(--purple)}.guide small{display:block;color:#8175aa;margin-top:4px}.main{margin-left:248px;flex:1;min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);padding:0 34px;display:flex;align-items:center;justify-content:space-between}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink)}.avatar{width:34px;height:34px;border-radius:50%;background:var(--pale);color:var(--purple);display:grid;place-items:center;font-weight:700}.content{max-width:1400px;padding:28px 34px 48px;margin:auto}.hero{background:linear-gradient(120deg,#f1edff,#faf8ff);border-radius:22px;padding:30px;display:flex;align-items:center;justify-content:space-between;min-height:190px;overflow:hidden}.hero .tag{font-size:12px;color:var(--purple);font-weight:700}.hero h1{font-size:clamp(25px,3vw,36px);line-height:1.35;margin:10px 0}.hero p{color:#77728d;margin:0 0 18px}.heroart{font-size:100px;opacity:.7;transform:rotate(-8deg);padding:0 30px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:7px}.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}.btn.ghost{background:transparent}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}.stat-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#f0edff;color:var(--purple);font-size:18px}.stat:nth-child(2) .stat-icon{background:#eaf4ff;color:var(--blue)}.stat:nth-child(3) .stat-icon{background:#eaf8f1;color:var(--green)}.stat:nth-child(4) .stat-icon{background:#fff3e8;color:var(--orange)}.stat label{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:24px}.stat strong small{font-size:12px;color:var(--muted);margin-left:3px}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.9fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h2{font-size:17px;margin:0}.panel p{font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;min-width:140px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #f0eff5;font-size:13px}th{font-size:11px;color:#9693a5;font-weight:600}td small{display:block;color:var(--muted);margin-top:3px}.pill{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;background:#f1eff8;color:#777}.pill.done{background:#eaf8f1;color:#16845e}.pill.scheduled{background:#eaf3ff;color:#3978bd}.pill.pending{background:#fff3e8;color:#b76a29}.group{padding:13px 0;border-bottom:1px solid #f1eff5}.group:last-child{border:0}.grouphead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.bar{height:7px;background:#f0edf6;border-radius:10px;overflow:hidden}.bar span{height:100%;display:block;background:var(--purple);border-radius:10px}.pagehead{margin-bottom:22px}.pagehead h1{margin:0 0 8px;font-size:26px}.pagehead p{margin:0;color:var(--muted)}.empty{padding:36px;text-align:center;color:var(--muted)}.list{list-style:none;padding:0;margin:0}.list li{padding:14px 0;border-bottom:1px solid var(--line)}.list li:last-child{border:0}.list p{color:var(--ink);margin:7px 0}.foot{color:#aaa6b5;text-align:center;padding:25px;font-size:12px}.mobile-nav{display:none}.modalback{position:fixed;inset:0;background:#1e183b66;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fff;border-radius:18px;width:min(540px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:19px}.x{border:0;background:#f4f2f8;border-radius:9px;padding:7px 11px}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:600;display:grid;gap:6px}.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;background:#fff}.form textarea{min-height:90px;resize:vertical}.formfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#29243d;color:white;padding:12px 18px;border-radius:12px;z-index:12;display:none}.surveyq{padding:13px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.surveyq label{display:block;margin:8px 0;font-weight:400}.mobile-hide{display:initial}
@media(max-width:950px){.sidebar{width:210px}.main{margin-left:210px}.content{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.heroart{font-size:75px;padding:0 5px}}@media(max-width:650px){.sidebar{display:none}.main{margin-left:0}.topbar{height:58px;padding:0 16px}.content{padding:16px 14px 90px}.hero{padding:22px;min-height:165px}.heroart{font-size:55px}.hero p{font-size:13px}.stats{gap:9px;margin:14px 0}.stat{padding:12px;gap:9px}.stat-icon{width:34px;height:34px}.stat strong{font-size:21px}.grid{gap:12px}.panel{padding:15px}.pagehead h1{font-size:23px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:4}.mobile-nav button{border:0;background:none;color:#8c899d;display:grid;gap:3px;justify-items:center;font-size:10px;padding:5px}.mobile-nav button.active{color:var(--purple);font-weight:700}.mobile-nav span{font-size:18px}.foot{padding:10px}.toolbar input{flex:1;min-width:0}.heroart{display:none}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brandicon">✦</div><div><strong>리서치랩</strong><small>고객 검증 워크스페이스</small></div></div><div class="navtitle">워크스페이스</div><nav class="nav" id="sideNav"></nav><button class="guide" onclick="showGuide()">📘 리서치 가이드<small>질문 만들기와 모집 기준</small></button></aside><div class="main"><header class="topbar"><div class="crumb">워크스페이스　›　<b id="crumb">대시보드</b></div><div class="avatar">R</div></header><main class="content" id="content"></main><div class="foot">리서치랩 · 고객 인터뷰와 연구 설문</div></div></div><nav class="mobile-nav" id="mobileNav"></nav><div id="modal"></div><div class="toast" id="toast"></div>
<script>
const KEY='researchlab.preview.v1';const views=[['home','▦','대시보드'],['people','♙','인터뷰 대상자'],['surveys','☷','설문조사'],['insights','✧','인사이트']];const sample=[{id:'s1',name:'김OO',desc:'30대 / 마케터',group:'핵심 타겟',source:'지인 소개',status:'완료',date:'2026-11-25 14:00',alternative:'엑셀 수기 관리',note:'데이터 취합에 매주 3시간 소요됨',sample:true},{id:'s2',name:'이OO',desc:'20대 / 대학생',group:'핵심 타겟',source:'에브리타임',status:'일정 확정',date:'2026-11-26 19:00',alternative:'노션',note:'모바일 앱 연동이 안 되어 불편함',sample:true},{id:'s3',name:'박OO',desc:'40대 / 자영업자',group:'대안 사용자',source:'관련 카페',status:'컨택 중',date:'',alternative:'경쟁 서비스',note:'요금제가 비싸서 해지 고민 중',sample:true},{id:'s4',name:'최OO',desc:'30대 / 프리랜서',group:'이탈/비사용',source:'링크드인',status:'섭외 대기',date:'',alternative:'사용 안 함',note:'기존 툴은 기능이 복잡해서 포기',sample:true},{id:'s5',name:'정OO',desc:'20대 / 직장인',group:'핵심 타겟',source:'오픈채팅방',status:'거절/보류',date:'',alternative:'카카오톡 나에게쓰기',note:'',sample:true}];let state=load();let view='home';function load(){try{return JSON.parse(localStorage.getItem(KEY))||{people:sample,surveys:[],responses:[]}}catch{return{people:sample,surveys:[],responses:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function nav(){let html=views.map(([id,ic,n])=>`<button class="${view===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${n}</button>`).join('');document.querySelector('#sideNav').innerHTML=html;document.querySelector('#mobileNav').innerHTML=views.map(([id,ic,n])=>`<button class="${view===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${n}</button>`).join('');document.querySelector('#crumb').textContent=views.find(x=>x[0]===view)[2]}function go(v){view=v;nav();render()}function render(){nav();let root=document.querySelector('#content');root.innerHTML=view==='home'?home():view==='people'?people():view==='surveys'?surveys():insights()}function home(){let counts=[state.people.length,state.people.filter(p=>p.status==='일정 확정').length,state.people.filter(p=>p.status==='완료').length,state.responses.length];return `<section class="hero"><div><div class="tag">✦ 고객 검증 워크스페이스</div><h1>좋은 질문에서<br>좋은 발견이 시작돼요.</h1><p>인터뷰 대상자 모집부터 연구 설문, 인사이트 정리까지 한곳에서 관리해요.</p><div class="actions"><button class="btn primary" onclick="personForm()">＋ 대상자 추가</button><button class="btn" onclick="go('surveys');surveyForm()">설문 만들기 →</button></div></div><div class="heroart">🗂️💬</div></section><div class="stats">${[['♙','전체 대상자',counts[0],'명'],['◷','일정 확정',counts[1],'명'],['✓','인터뷰 완료',counts[2],'명'],['☷','설문 응답',counts[3],'건']].map(a=>`<div class="stat"><div class="stat-icon">${a[0]}</div><div><label>${a[1]}</label><strong>${a[2]}<small>${a[3]}</small></strong></div></div>`).join('')}</div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>인터뷰 대상자</h2><p>섭외 현황과 인터뷰 일정을 관리해요.</p></div><button class="btn" onclick="go('people')">전체 보기 →</button></div>${table(state.people.slice(0,5))}</section><section class="panel"><h2>그룹별 모집 현황</h2><p>각 그룹에서 3~5명을 만나 보세요.</p>${['핵심 타겟','대안 사용자','이탈/비사용'].map(g=>{let n=state.people.filter(p=>p.group===g&&p.status!=='거절/보류').length;return `<div class="group"><div class="grouphead"><b>${g}</b><span>${n} / 5명</span></div><div class="bar"><span style="width:${Math.min(n/5*100,100)}%"></span></div></div>`}).join('')}<button class="btn ghost" onclick="showGuide()">모집 기준 보기 →</button></section></div>`}function table(rows){if(!rows.length)return'<div class="empty">등록된 대상자가 없습니다.</div>';return `<div class="tablewrap"><table><thead><tr><th>이름 / 특징</th><th>그룹</th><th>섭외 경로</th><th>진행 상태</th><th>인터뷰 일시</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.name)}</b>${p.sample?'<small>예시</small>':''}<small>${esc(p.desc||'')}</small></td><td>${esc(p.group)}</td><td>${esc(p.source||'—')}</td><td><span class="pill ${p.status==='완료'?'done':p.status==='일정 확정'?'scheduled':'pending'}">${esc(p.status)}</span></td><td>${esc(p.date||'—')}</td><td><button class="btn" onclick="personForm('${p.id}')">편집</button></td></tr>`).join('')}</tbody></table></div>`}function people(){return `<div class="pagehead"><h1>인터뷰 대상자</h1><p>고객 섭외 현황과 인터뷰 일정을 관리해요.</p></div><section class="panel"><div class="panelhead"><button class="btn primary" onclick="personForm()">＋ 대상자 추가</button><button class="btn" onclick="csv()">⇩ CSV 내보내기</button><button class="btn" onclick="clearSamples()">예시 데이터 지우기</button></div><div class="toolbar"><input id="search" placeholder="이름, 특징 검색…" oninput="filterPeople()"><select id="groupFilter" onchange="filterPeople()"><option value="">전체 그룹</option><option>핵심 타겟</option><option>대안 사용자</option><option>이탈/비사용</option></select><select id="statusFilter" onchange="filterPeople()"><option value="">전체 상태</option>${statuses.map(s=>`<option>${s}</option>`).join('')}</select></div><div id="peopleTable">${table(state.people)}</div></section>`}const statuses=['섭외 대기','컨택 중','일정 확정','완료','거절/보류'];function filterPeople(){let q=document.querySelector('#search').value.toLowerCase(),g=document.querySelector('#groupFilter').value,s=document.querySelector('#statusFilter').value;document.querySelector('#peopleTable').innerHTML=table(state.people.filter(p=>(!g||p.group===g)&&(!s||p.status===s)&&(`${p.name} ${p.desc} ${p.alternative}`.toLowerCase().includes(q))))}function personForm(id){let p=state.people.find(x=>x.id===id)||{};modal('대상자 '+(id?'편집':'추가'),`<form class="form" onsubmit="savePerson(event,'${id||''}')"><label>이름 / 닉네임<input name="name" required value="${esc(p.name||'')}" placeholder="예: 김OO"></label><label>특징<input name="desc" value="${esc(p.desc||'')}" placeholder="예: 30대 / 마케터"></label><label>그룹<select name="group">${['핵심 타겟','대안 사용자','이탈/비사용'].map(g=>`<option ${p.group===g?'selected':''}>${g}</option>`).join('')}</select></label><label>섭외 경로<input name="source" value="${esc(p.source||'')}"></label><label>진행 상태<select name="status">${statuses.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>인터뷰 일시<input name="date" type="datetime-local" value="${(p.date||'').replace(' ','T')}"></label><label>현재 사용하는 대안<input name="alternative" value="${esc(p.alternative||'')}"></label><label>핵심 인사이트<textarea name="note">${esc(p.note||'')}</textarea></label><div class="formfooter"><button type="button" class="btn" onclick="closeModal()">취소</button>${id?`<button type="button" class="btn" onclick="deletePerson('${id}')">삭제</button>`:''}<button class="btn primary">저장</button></div></form>`)}function savePerson(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.id=id||crypto.randomUUID();if(id)state.people=state.people.map(p=>p.id===id?{...p,...d,sample:false}:p);else state.people.unshift({...d,sample:false});save();closeModal();render();toast('대상자 정보를 저장했어요.')}function deletePerson(id){if(confirm('이 대상자 기록을 삭제할까요?')){state.people=state.people.filter(p=>p.id!==id);save();closeModal();render();toast('삭제했습니다.')}}function clearSamples(){state.people=state.people.filter(p=>!p.sample);save();render();toast('예시 데이터를 삭제했어요.')}function csv(){let rows=[['이름','특징','그룹','현재 대안','섭외 경로','상태','인터뷰 일시','인사이트'],...state.people.filter(p=>!p.sample).map(p=>[p.name,p.desc,p.group,p.alternative,p.source,p.status,p.date,p.note])];let blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>`"${String(v||'').replaceAll('"','""')}"`).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='인터뷰-대상자.csv';a.click();URL.revokeObjectURL(a.href)}function insights(){let rows=state.people.filter(p=>p.note);return `<div class="pagehead"><h1>인터뷰 인사이트</h1><p>대상자별 발견을 비교하고 다음 질문을 정리해요.</p></div><section class="panel"><div class="panelhead"><h2>기록된 인사이트 ${rows.length}개</h2><button class="btn" onclick="showGuide()">질문 가이드</button></div>${rows.length?`<ul class="list">${rows.map(p=>`<li><b>${esc(p.name)}</b>　<span class="pill">${esc(p.group)}</span><p>${esc(p.note)}</p><button class="btn" onclick="personForm('${p.id}')">기록 편집</button></li>`).join('')}</ul>`:'<div class="empty">대상자 상세 화면에서 인터뷰 인사이트를 기록하면 여기에 보여요.</div>'}</section>`}function surveys(){return `<div class="pagehead"><h1>설문조사</h1><p>간단한 설문을 만들고 응답을 수집해요.</p></div><section class="panel"><div class="panelhead"><h2>내 설문</h2><button class="btn primary" onclick="surveyForm()">＋ 설문 만들기</button></div>${state.surveys.length?state.surveys.map(s=>`<div class="group"><div class="grouphead"><b>${esc(s.title)}</b><span>${state.responses.filter(r=>r.surveyId===s.id).length} 응답</span></div><p>${esc(s.intro||'')}</p><div class="actions"><button class="btn" onclick="takeSurvey('${s.id}')">응답하기</button><button class="btn" onclick="surveyResults('${s.id}')">결과 보기</button><button class="btn" onclick="deleteSurvey('${s.id}')">삭제</button></div></div>`).join(''):'<div class="empty">아직 설문이 없어요. 첫 설문을 만들어 보세요.</div>'}</section>`}function surveyForm(){modal('새 설문 만들기',`<form class="form" onsubmit="saveSurvey(event)"><label>설문 제목<input name="title" required placeholder="예: 창업자 고객검증 인터뷰"></label><label>설문 안내<textarea name="intro" placeholder="설문 목적과 참여 안내"></textarea></label><label>질문 1<input name="q1" required placeholder="질문을 입력하세요"></label><label>질문 유형<select name="t1"><option>서술형</option><option>객관식</option><option>5점 척도</option></select></label><label>질문 2<input name="q2" placeholder="선택 질문"></label><label>질문 3<input name="q3" placeholder="선택 질문"></label><div class="formfooter"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">저장</button></div></form>`)}function saveSurvey(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let questions=[d.q1,d.q2,d.q3].filter(Boolean).map((text,i)=>({text,type:i===0?d.t1:'서술형'}));state.surveys.unshift({id:crypto.randomUUID(),title:d.title,intro:d.intro,questions});save();closeModal();render();toast('설문을 저장했어요.')}function takeSurvey(id){let s=state.surveys.find(x=>x.id===id);modal(s.title,`<p>${esc(s.intro||'설문에 참여해 주셔서 감사합니다.')}</p><form class="form" onsubmit="submitSurvey(event,'${id}')">${s.questions.map((q,i)=>`<label>${i+1}. ${esc(q.text)}${q.type==='5점 척도'?`<select name="a${i}" required>${[1,2,3,4,5].map(n=>`<option value="${n}">${n}점</option>`).join('')}</select>`:q.type==='객관식'?`<input name="a${i}" required placeholder="응답 입력 (객관식 옵션은 직접 입력)"/>`:`<textarea name="a${i}" required></textarea>`}</label>`).join('')}<div class="formfooter"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">응답 제출</button></div></form>`)}function submitSurvey(e,id){e.preventDefault();let s=state.surveys.find(x=>x.id===id),answers=s.questions.map((q,i)=>({question:q.text,answer:new FormData(e.target).get('a'+i)}));state.responses.push({id:crypto.randomUUID(),surveyId:id,answers,created:new Date().toISOString()});save();closeModal();render();toast('설문 응답이 저장됐어요.')}function surveyResults(id){let s=state.surveys.find(x=>x.id===id),r=state.responses.filter(x=>x.surveyId===id);modal('설문 결과 · '+s.title,`<p>응답 ${r.length}건</p>${r.length?r.map((x,i)=>`<div class="surveyq"><b>응답 ${i+1}</b>${x.answers.map(a=>`<p><b>${esc(a.question)}</b><br>${esc(a.answer)}</p>`).join('')}</div>`).join(''):'<div class="empty">응답이 아직 없습니다.</div>'}`)}function deleteSurvey(id){if(confirm('설문과 응답을 삭제할까요?')){state.surveys=state.surveys.filter(s=>s.id!==id);state.responses=state.responses.filter(r=>r.surveyId!==id);save();render()}}function showGuide(){modal('리서치 가이드',`<h3>누구를 만날까요?</h3><p>세 그룹에서 각각 3~5명을 모집해 서로 다른 경험을 비교해 보세요. 지인 외 경로에서도 참여자를 찾아보세요.</p><ul><li><b>핵심 타겟</b> · 문제를 자주 겪는 잠재 고객</li><li><b>대안 사용자</b> · 다른 방법으로 해결하는 고객</li><li><b>이탈/비사용</b> · 사용을 중단했거나 쓰지 않는 고객</li></ul><h3>인터뷰 질문 예시</h3><ol><li>최근 이 문제를 경험한 순간은 언제였나요?</li><li>그때 어떻게 해결했나요?</li><li>해결하는 데 시간이나 비용이 얼마나 들었나요?</li><li>현재 해결 방법에서 가장 불편한 점은 무엇인가요?</li><li>이 문제를 해결하기 위해 실제로 돈을 지불한 적이 있나요?</li><li>이 문제를 해결하지 못하면 어떤 일이 생기나요?</li></ol><p><b>팁:</b> 서비스 아이디어를 먼저 소개하지 말고 최근 경험을 질문하세요. 칭찬보다 실제 행동과 비용을 기록하세요.</p>`)}function modal(title,body){document.querySelector('#modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modalhead"><h2>${title}</h2><button class="x" onclick="closeModal()">닫기 ✕</button></div>${body}</section></div>`}function closeModal(){document.querySelector('#modal').innerHTML=''}function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script></body></html>
